<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="container">

        <!-- Card 1 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" 
                 alt="Headphones">

            <h2>Wireless Headphones</h2>

            <p>
                High-quality wireless headphones with excellent sound.
            </p>

            <h3>₹1,999</h3>

            <button>Buy Now</button>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" 
                 alt="Smart Watch">

            <h2>Smart Watch</h2>

            <p>
                Track your fitness, notifications and daily activities.
            </p>

            <h3>₹2,499</h3>

            <button>Buy Now</button>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" 
                 alt="Camera">

            <h2>Digital Camera</h2>

            <p>
                Capture your best moments with this powerful camera.
            </p>

            <h3>₹4,999</h3>

            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
